nameOverride: ""

image:
  repository: ghcr.io/fixter-dev/fixter-collector
  tag: ""
  pullPolicy: IfNotPresent

fixter:
  apiKey: ""
  existingSecret: ""
  existingSecretKey: FIXTER_API_KEY
  endpoint: https://ingest.fixter.dev
  environment: production
  clusterName: ""

cluster:
  enabled: true
  clusterMetrics: true
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

integrations:
  prometheus:
    targets: []

agent:
  enabled: true
  otlpRelay: true
  hostMetrics: true
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  logs:
    enabled: true
    excludeNamespaces:
      - kube-system
    excludePods: []
    formats: []
    presets:
      spring:
        continuationRegex: '^\s|^at\s+\S+\(.*\)$|^Caused by:|^Suppressed:|^\.\.\. \d+ (?:more|common frames omitted)|^(?:[\w$]+\.)+[\w$]*(?:Exception|Error|Throwable)(?::|$)'
        severityRegex: '^\S+ +(?:\d\d:\d\d:\d\d[.,]\d+ +)?(?P<severity>[A-Z]+) '
        severityMapping: {}
      clickhouse:
        continuationRegex: '^\s|^\d+\.\s'
        severityRegex: '<(?P<severity>[A-Za-z]+)>'
        severityMapping:
          info: [information, notice]
          trace: [test]
          fatal: [critical]
      postgres:
        continuationRegex: '^\s|^(?:DETAIL|HINT|CONTEXT|QUERY|STATEMENT|LOCATION):'
        severityRegex: '\]\s*(?:[\w.-]+@[\w.-]+\s+)?(?P<severity>[A-Z][A-Z0-9]*):'
        severityMapping:
          info: [log, notice]
          debug: [debug1, debug2, debug3, debug4, debug5]
          fatal: [panic]
      mysql:
        continuationRegex: '^\s'
        severityRegex: '\[(?P<severity>System|Warning|ERROR|Note)\]'
        severityMapping:
          info: [system, note]
      doris-fe:
        continuationRegex: '^\s|^at\s+\S+\(.*\)$|^Caused by:|^Suppressed:|^\.\.\. \d+ more|^(?:[\w$]+\.)+[\w$]*(?:Exception|Error|Throwable)(?::|$)'
        severityRegex: '^\S+ \S+ (?P<severity>[A-Z]+) '
        severityMapping: {}
      logfmt:
        severityKey: level
        severityMapping: {}
      python:
        continuationRegex: '^\s|^$|^Traceback \(most recent call last\):|^During handling of the above exception|^The above exception was the direct cause|^(?:[A-Za-z_]\w*\.)+[A-Za-z_]*(?:Error|Exception|Interrupt|Exit|Iteration|Warning|Group)(?::|$)|^[A-Za-z_]\w*(?:Error|Exception|Interrupt|Exit|Iteration|Warning|Group)(?::|$)'
        severityRegex: '^(?:\d{4}-\d{2}-\d{2} \d\d:\d\d:\d\d(?:[,.]\d{3})? (?:- [^\s]+ - )?)?(?P<severity>CRITICAL|ERROR|WARNING|INFO|DEBUG)[: ]'
        severityMapping:
          fatal: [critical]
      dotnet:
        continuationRegex: '^\s'
        severityRegex: '^(?P<severity>trce|dbug|info|warn|fail|crit): '
        severityMapping:
          trace: [trce]
          debug: [dbug]
          error: [fail]
          fatal: [crit]
      go-stdlib:
        continuationRegex: '^\s|^$|^goroutine \d|^\[signal |^created by \S|^\S+\.\S*\(.*\)$'
      zap-console:
        continuationRegex: '^\s|^[\w*()./\[\]-]+\.[A-Za-z_*(][\w*()./\[\]-]*$'
        severityRegex: '^[^\t\n]+\t(?P<severity>(?i:DEBUG|INFO|WARN|ERROR|DPANIC|PANIC|FATAL))\t'
        severityMapping:
          fatal: [dpanic, panic]
    structural:
      json:
        enabled: true
        severityField: level
        traceIdField: trace_id
        spanIdField: span_id
        traceFlagsField: trace_flags
        severityMapping:
          trace: 10
          debug: 20
          info: 30
          warn: 40
          error: 50
          fatal: 60
      glog:
        enabled: true
        detectRegex: '^[IWEF]\d{4} '
        severityRegex: '^(?P<severity>[IWEF])\d{4} '
        severityMapping:
          info: [i]
          warn: [w]
          error: [e]
          fatal: [f]
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
