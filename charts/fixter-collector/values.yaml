nameOverride: ""

image:
  repository: ghcr.io/fixter-dev/fixter-collector
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

fixter:
  # The ONLY required value. The chart creates a Secret from it.
  apiKey: ""
  # Bring-your-own Secret instead. Mutually exclusive with apiKey.
  existingSecret: ""
  existingSecretKey: FIXTER_API_KEY
  # Defaults to Fixter's public ingest — a customer should never need to set this.
  endpoint: https://ingest.fixter.dev
  environment: production      # -> deployment.environment
  # Set this to disambiguate clusters in Fixter. NOT auto-detected — when empty,
  # k8s.cluster.name is simply absent, so multi-cluster telemetry is
  # indistinguishable. Strongly recommended if you run more than one cluster.
  clusterName: ""

cluster:
  enabled: true
  clusterMetrics: true
  # NOTE: replicas is deliberately not configurable. k8s_cluster and prometheus
  # duplicate their output per replica, so >1 double-counts rather than adds HA.
  # The singleton must still be able to schedule on a fully-tainted cluster, or
  # it sits Pending forever and cluster metrics vanish silently (same failure the
  # agent's tolerations guard against). Default tolerates everything; constrain
  # by overriding.
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Hardened defaults, applied to the CLUSTER collector. The agent overrides these
# (see agent.podSecurityContext) — it must read root-owned host files.
# Overridable, but sane out of the box:
# the image already runs as 10001, the collector writes nothing to its rootfs
# (config is a mounted ConfigMap; no filelog on-disk checkpoint), and both host
# mounts are read-only — so readOnlyRootFilesystem holds. Applied to BOTH
# collectors. Kept permissive enough to pass baseline PSA; restricted PSA users
# can layer more via these same keys.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

integrations:
  prometheus:
    targets: []   # [{job, endpoints, interval}]

agent:
  enabled: true
  otlpRelay: true
  hostMetrics: true
  # The agent MUST run as root. /var/log/pods on EKS (and most containerd
  # distros) is root-owned, so a non-root agent silently reads NOTHING:
  # file_log starts, can open no file, logs no error, and the pod stays Ready
  # while collecting zero logs. kind's permissions are permissive, so a kind
  # smoke test CANNOT catch this — only a real cluster can. Every log-collecting
  # DaemonSet (Fluent Bit, Datadog, Vector) runs as root for the same reason:
  # reading root-owned host logs is inherently privileged.
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  logs:
    enabled: true
    # The collector's own pods are ALWAYS excluded regardless of this list.
    excludeNamespaces:
      - kube-system
    excludePods: []
    # The container operator only unwraps the CRI envelope — it never reads the
    # application's own line. Without the operators these values drive, every log
    # arrives with no severity and each stack-trace line becomes its own record.
    #
    # JSON bodies are parsed as JSON; everything else falls back to a regex over
    # the text. Both paths are best-effort: a format neither recognises still
    # ships, just without a severity.
    parsing:
      enabled: true
      # A line matching this CONTINUES the record above (stack frames, wrapped
      # messages); anything else starts a new record.
      #
      # This detects continuations rather than record-starts, and that direction
      # matters. The inverse ("a line matching X starts a record") appends every
      # non-matching line to the record above — so a format the pattern does not
      # know (Go's `time=...`/`2026/07/16`, .NET's `info:`) has EVERY line
      # treated as a continuation and unrelated log events get merged into one
      # record. Detecting continuations fails the safe way instead: an unknown
      # format degrades to one-record-per-line, which is merely the status quo.
      # Splitting a record is recoverable; merging unrelated events is not.
      #
      # Covers indented frames (universal: Java `\tat`, Python `  File`, Go
      # `\t/app/x.go:10`, C# `   at`, JS `    at`) plus the unindented lines that
      # are unambiguously part of a trace. `\d+\.\s` is ClickHouse, whose stack
      # frames are numbered ("0. DB::Exception::Exception(...) @ 0x... in ...")
      # and start with a digit rather than an indent. Its own log lines are not
      # caught by it: "2026.07.16 09:00:00" has no space after the first dot.
      #
      # `\S+\.\w+\([^)]*\)$` is a Go stack frame's function line
      # ("k8s.io/apimachinery/pkg/util/runtime.logPanic(0x1, 0x2)"), which sits
      # UNINDENTED between the indented file:line rows — every Kubernetes
      # controller is Go, so its panics fragment without this. Anchored to a
      # closing paren at end-of-line so an ordinary message that merely opens
      # with a call ("Reconciler.Run(ctx) failed") is not swallowed.
      #
      # Every addition here is a globbing risk — a pattern that matches a real
      # log line appends it to the record above. Keep them narrow.
      continuationRegex: '^(\s|\d+\.\s|Caused by:|\.\.\.\s\d+\smore|at\s|Traceback \(most recent call last\):|goroutine \d|panic:|created by \S|\S+\.\w+\([^)]*\)$|\w+(\.\w+)*(Exception|Error)([:\s]|$))'
      # Bounds the buffer: flush a held-open record after this long with no new
      # line, and never let one grow past this size.
      forceFlushPeriod: 5s
      # Keep the unit suffix: a bare 1048576 renders through Helm as the float
      # 1.048576e+06, which is legal but unreadable in a shipped config.
      maxLogSize: 1MiB
      glog:
        # glog encodes severity as a single leading letter (I/W/E/F) followed by
        # MMDD — "I0716 09:00:00.123456 12345 status.cpp:100] msg". Doris BE uses
        # it, as does anything built on glog. No word-based regex can reach it,
        # so it gets its own route rather than another alternative in the text
        # pattern. Set enabled=false if a workload's logs start with a capital
        # I/W/E/F followed by four digits and a space and are NOT glog.
        enabled: true
        detectRegex: '^[IWEF]\d{4} '
        severityRegex: '^(?P<severity>[IWEF])\d{4} '
        severityMapping:
          info: [i]
          warn: [w]
          error: [e]
          fatal: [f]
      json:
        # Field holding the level in a JSON log (logback/zap/winston/pino).
        severityField: level
        # pino and bunyan emit NUMERIC levels; without a mapping they arrive as
        # severity text "30" with SeverityNumber Unspecified(0) — parsed but
        # useless. String levels ("info") are understood without any mapping, so
        # this only adds the numeric case.
        severityMapping:
          trace: 10
          debug: 20
          info: 30
          warn: 40
          error: 50
          fatal: 60
      text:
        # Case-insensitive, and NOT anchored to an ISO timestamp: Python's
        # default asctime is "2026-07-16 09:00:02,124" — date and time separated
        # by a space — so a `^\S+\s+LEVEL` anchor never reaches the level. The
        # {0,48} window keeps the level near the line start, so a message merely
        # CONTAINING "error" further along is not misread as ERROR severity.
        # Longer alternatives precede their abbreviations, since the engine takes
        # the first that matches (INFORMATION before INFO before INF).
        #
        # Each alternative carries its own trailing \b — a shared one cannot work
        # for `LOG:`, where the boundary would fall between ':' and a space (two
        # non-word chars, so no boundary exists and the match fails).
        #
        # `LOG:` keeps its colon deliberately. Postgres' most common level is
        # bare "LOG", which as a word is far too generic — it would tag any line
        # merely mentioning a log file. The colon makes it Postgres-specific, at
        # the cost of "LOG:" (with colon) as the severity TEXT; the mapping below
        # still resolves it to a correct severity NUMBER, which is what filtering
        # and alerting use.
        #
        # Heuristic, not a guarantee: unmatched simply means no severity.
        severityRegex: '(?i)^.{0,48}?\b(?P<severity>TRACE\b|DEBUG[1-5]\b|DEBUG\b|DBG\b|INFORMATION\b|INFO\b|INF\b|NOTICE\b|NOTE\b|SYSTEM\b|WARNING\b|WARN\b|WRN\b|ERROR\b|ERR\b|CRITICAL\b|CRIT\b|FATAL\b|PANIC\b|LOG:)'
        # The six OTel names are understood already; everything else is not and
        # would yield SeverityNumber Unspecified(0) — captured but unusable.
        #   inf/wrn/err/crit  Serilog
        #   information/notice/test  ClickHouse (<Information>, <Notice>, <Test>)
        #   note/system       MySQL ([Note], [System])
        #   log:/panic/debug1-5  PostgreSQL
        severityMapping:
          trace: [trc, test]
          debug: [dbg, debug1, debug2, debug3, debug4, debug5]
          info: [inf, information, notice, note, system, "log:"]
          warn: [wrn]
          error: [err]
          fatal: [crit, critical, panic]
  # Tolerate everything by default. A DaemonSet that cannot schedule on a
  # tainted node produces no telemetry and no error — silent blindness.
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
