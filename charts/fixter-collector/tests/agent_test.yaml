          pattern: 'type: key_value_parser\n +id: format-severity\n +parse_from: body\n +parse_to: attributes\n +on_error: send_quiet\n +severity:\n +parse_from: attributes\.level'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'regex: "level='
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'file_log/logfmt:[\s\S]*?type: recombine[\s\S]*?file_log/default:'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'file_log/logfmt:[\s\S]*?is_first_entry[\s\S]*?file_log/default:'

  - it: rejects a format that sets both severityKey and severityRegex
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - preset: logfmt
          include: ["/var/log/pods/gokit_*/*/*.log"]
          severityRegex: "lvl=(?P<severity>x)"
    asserts:
      - failedTemplate:
          errorMessage: 'a log format sets both severityKey and severityRegex; they are two different parsers for the same field and only one can run. severityKey parses the line as key=value pairs (key_value_parser); severityRegex pattern-matches it (regex_parser). Set exactly one. If you set severityKey on a format whose preset ships a severityRegex (or vice versa), also set the other to null to drop it.'

  - it: lets severityKey be cleared to null to fall back to a regex
    template: configmap-agent.yaml
    set:
