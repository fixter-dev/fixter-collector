suite: agent collector
templates:
  - configmap-agent.yaml
  - daemonset-agent.yaml
  - service-agent.yaml
  - secret.yaml
tests:
  - it: is a DaemonSet
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - isKind:
          of: DaemonSet

  - it: tolerates all taints by default so no node is silently skipped
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            operator: Exists

  - it: always excludes its own pods from file_log even with no user excludes
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.excludeNamespaces: []
    asserts:
      # Assert the own-pod pattern is the FIRST exclude entry, not merely
      # present — the ordering (own pods before user excludes) is the contract.
      # Allows the template's leading comment lines between `exclude:` and the
      # first bullet, but no other bullet may come before the own-pod one.
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exclude:\\s*\\n(\\s*#[^\\n]*\\n)*\\s*- /var/log/pods/\\*_RELEASE-NAME-fixter-collector"

  - it: routes the agent GOMEMLIMIT through the Go-format helper, not raw k8s
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: "512MiB"

  - it: uses the canonical otlp_http exporter key in agent config, not the alias
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "otlp_http:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "otlphttp:"

  - it: wires otlp into the traces pipeline as a RECEIVER when relay is on
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.otlpRelay: true
      agent.logs.enabled: true
    asserts:
      # Pin otlp as the traces RECEIVER. A loose match falsely hits otlp_http on
      # the exporters line (verified by mutation: passed with receivers: [BOGUS]).
      # The traces pipeline renders its receivers in flow style (`[otlp]`)
      # rather than block style (`- otlp`), so match either form.
      - matchRegex:
          path: data["config.yaml"]
          pattern: "traces:\\s*\\n\\s*receivers: \\[otlp\\]"

  - it: derives the service identity triad from k8s attributes for pod logs and metrics
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.enabled: true
      agent.otlpRelay: true
    asserts:
      # The derive-service processor copies from the k8s attributes k8s_attributes
      # already extracts, with a deployment -> container fallback for service.name.
      - matchRegex:
          path: data["config.yaml"]
          pattern: "resource/derive_service:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "from_attribute: k8s.deployment.name"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "key: service.namespace"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "key: service.instance.id"
      # It runs in BOTH the logs and metrics pipelines (self-scoping insert: infra
      # metrics with no deployment just no-op through it).
      - matchRegex:
          path: data["config.yaml"]
          pattern: "processors: \\[memory_limiter, k8s_attributes, resource_detection, resource, resource/derive_service, batch\\]"
      # Traces keep the original list — relayed traces always carry their own service.
      - matchRegex:
          path: data["config.yaml"]
          pattern: "traces:\\s*\\n\\s*receivers: \\[otlp\\]\\s*\\n\\s*processors: \\[memory_limiter, k8s_attributes, resource_detection, resource, batch\\]"

  - it: honours excludeNamespaces
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.excludeNamespaces:
        - kube-system
        - istio-system
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "/var/log/pods/istio-system_"

  - it: drops the file_log receiver entirely when logs are disabled
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "file_log:"

  - it: exposes OTLP http for app relay
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: otlp-http
            containerPort: 4318
            protocol: TCP

  - it: keeps app OTLP traffic on the local node
    template: service-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - equal:
          path: spec.internalTrafficPolicy
          value: Local

  # Regression: a non-root agent CANNOT read /var/log/pods on EKS (root-owned)
  # and silently collects zero logs — file_log logs no error and the pod stays
  # Ready. kind's perms are permissive so a smoke test cannot catch it. Verified
  # on a real EKS node: as uid 10001, `ls /var/log/pods` -> Permission denied.
  - it: runs the agent as root so it can read root-owned pod logs
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false

  # ── log parsing: severity + multiline ──────────────────────────────────────
  # The container operator only unwraps the CRI envelope; it never looks at the
  # application's own line. Without the operators below, every log arrives with
  # no severity and each stack-trace line becomes its own record.
  - it: joins continuation lines so a stack trace is one record, not one per line
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: recombine"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "combine_field: body"

  # A source_identifier is not cosmetic: without it recombine interleaves lines
  # from every pod on the node into one stream and stitches unrelated logs
  # together.
  - it: recombines per log file so concurrent pods cannot interleave
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'source_identifier: attributes\["log.file.path"\]'

  # The safety valve for the recombine failure mode: an app whose lines never
  # match firstEntryRegex would otherwise buffer forever into one giant entry.
  - it: bounds recombine so an unmatched format cannot buffer forever
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "force_flush_period: 5s"
      # Assert the VALUE, not just the key: a bare integer here renders through
      # Helm as the float 1.048576e+06.
      - matchRegex:
          path: data["config.yaml"]
          pattern: "max_log_size: 1MiB"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "max_log_size: [0-9.]+e\\+"

  - it: routes JSON bodies to the json parser and takes severity from the level field
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: router"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: json_parser"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "parse_from: attributes.level"

  - it: falls back to a text severity regex for non-JSON logs
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: regex_parser"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "ERROR"

  # A parser that hard-fails drops the log. An unrecognised format must degrade
  # to "no severity", never to "no log".
  - it: never drops a log whose format neither parser recognises
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "on_error: send_quiet"

  - it: lets an operator override the continuation pattern for its own log format
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.parsing.continuationRegex: "^CUSTOM-CONT"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "CUSTOM-CONT"

  # The direction is the whole safety property. is_first_entry must be the
  # NEGATION of a continuation pattern: with the inverse ("this starts a record"),
  # any format the pattern does not know has EVERY line treated as a continuation
  # and unrelated events merge into one record. Verified against the real binary:
  # the un-negated form turned 12 mixed-language lines into 5 records, gluing a
  # .NET log onto the end of a Python traceback.
  - it: negates the continuation pattern so an unknown format never globs
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: .!\(body matches'

  # Regression: is_first_entry is an expr expression, so the pattern sits inside
  # a string literal and each backslash must survive expr's unescape before the
  # regex engine sees it. Emitting the raw pattern renders `\s`, which expr
  # rejects at startup ("invalid char escape") — the collector then crashloops
  # and the node ships NO logs at all. Caught only by running the rendered
  # config; every string-presence assertion passed while it was broken.
  - it: double-escapes the continuation pattern so expr can compile it
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: .!\(body matches "\^\(\\\\s\|'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: .!\(body matches "\^\([^\\]\\s\|'

  - it: double-escapes an operator's custom pattern too
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.parsing.continuationRegex: '^\d{2}:\d{2}'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: .!\(body matches "\^\\\\d\{2\}:\\\\d\{2\}"\)'

  # pino/bunyan emit numeric levels. Unmapped they arrive as severity text "30"
  # with SeverityNumber Unspecified(0) — parsed but useless.
  - it: maps numeric JSON levels so pino and bunyan get a real severity
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "info: 30"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "error: 50"

  # Serilog's "[09:00:03 INF]" captures INF, which is not a severity name stanza
  # knows — without the mapping it yields SeverityNumber Unspecified(0). Same for
  # ClickHouse's <Information>/<Notice>, MySQL's [Note]/[System] and Postgres'
  # LOG:/PANIC.
  - it: maps vendor level names so Serilog, ClickHouse, MySQL and Postgres resolve
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'info: \["inf","information","notice","note","system","log:"\]'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'fatal: \["crit","critical","panic"\]'

  # Regression: rendering the mapping with `join` leaves values unquoted, and an
  # unquoted `log:` inside a YAML flow sequence parses as a nested MAP — the
  # collector then refuses to start with "type map[string]interface {} cannot be
  # parsed as a severity" and the node ships NO logs. yq hides this by re-quoting
  # on display; only the raw text and the real binary show it.
  - it: quotes severity mapping values so a trailing colon cannot become a map
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '"log:"'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: '\[[^]"]*log:\]'

  # glog encodes severity as a single leading letter (Doris BE: "I0716 ..."). No
  # word-based regex can reach it, so it gets its own route.
  - it: routes glog logs so Doris BE gets a severity
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "id: glog-severity"
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'body matches "\^\[IWEF\]\\\\d\{4\} "'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'error: \["e"\]'

  - it: can turn the glog route off without touching the other paths
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.parsing.glog.enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "glog-severity"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "id: json-severity"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "id: text-severity"

  # ClickHouse stack frames are numbered ("0. DB::Exception... @ 0x...") rather
  # than indented, so the universal leading-whitespace rule misses them.
  - it: treats numbered stack frames as continuations for ClickHouse
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '\\\\d\+\\\\\.\\\\s'

  - it: recognises database level words in the text severity pattern
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      # Postgres LOG keeps its colon: bare "LOG" is too generic and would tag any
      # line mentioning a log file.
      - matchRegex:
          path: data["config.yaml"]
          pattern: "LOG:"
      # Longest-first, or INFO would consume the start of INFORMATION.
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'INFORMATION\\b\|INFO\\b\|INF\\b'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'DEBUG\[1-5\]\\b\|DEBUG\\b'

  # Python's default asctime is "2026-07-16 09:00:02,124" — date and time split
  # by a space — so an ISO-anchored `^\S+\s+LEVEL` never reaches the level.
  - it: does not anchor text severity to an ISO timestamp
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '\(\?i\)\^\.\{0,48\}\?'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'severityRegex.*\^\\\\S\+\\\\s\+'

  - it: lets an operator override the JSON severity field
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.parsing.json.severityField: severity_text
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "parse_from: attributes.severity_text"

  - it: can be turned off entirely, leaving only the container parser
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.parsing.enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "type: recombine"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "type: router"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: container"

  - it: does not emit parsing operators when logs are disabled
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "type: recombine"

  - it: maps JSON trace context onto the log record so logs correlate to traces
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'trace:\s*\n\s*trace_id:\s*\n\s*parse_from: attributes\.trace_id'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'span_id:\s*\n\s*parse_from: attributes\.span_id'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'trace_flags:\s*\n\s*parse_from: attributes\.trace_flags'

  - it: honours overridden JSON trace field names
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.parsing.json.traceIdField: traceId
      agent.logs.parsing.json.spanIdField: spanId
      agent.logs.parsing.json.traceFlagsField: traceFlags
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'parse_from: attributes\.traceId'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'parse_from: attributes\.spanId'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'parse_from: attributes\.traceFlags'
