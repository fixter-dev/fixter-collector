suite: agent collector
templates:
  - configmap-agent.yaml
  - daemonset-agent.yaml
  - service-agent.yaml
  - secret.yaml
  - NOTES.txt
tests:
  - it: is a DaemonSet
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - isKind:
          of: DaemonSet

  - it: tolerates all taints by default so no node is silently skipped
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            operator: Exists

  - it: always excludes its own pods from file_log even with no user excludes
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.excludeNamespaces: []
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exclude:\\s*\\n(\\s*#[^\\n]*\\n)*\\s*- /var/log/pods/\\*_RELEASE-NAME-fixter-collector"

  - it: routes the agent GOMEMLIMIT through the Go-format helper, not raw k8s
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: "512MiB"

  - it: uses the canonical otlp_http exporter key in agent config, not the alias
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "otlp_http:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "otlphttp:"

  - it: wires otlp into the traces pipeline as a RECEIVER when relay is on
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.otlpRelay: true
      agent.logs.enabled: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "traces:\\s*\\n\\s*receivers: \\[otlp\\]"

  - it: derives the service identity triad from k8s attributes for pod logs and metrics
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.enabled: true
      agent.otlpRelay: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "resource/derive_service:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "from_attribute: k8s.deployment.name"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "key: service.namespace"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "key: service.instance.id"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "processors: \\[memory_limiter, k8s_attributes, resource_detection, resource, resource/derive_service, batch\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "traces:\\s*\\n\\s*receivers: \\[otlp\\]\\s*\\n\\s*processors: \\[memory_limiter, k8s_attributes, resource_detection, resource, batch\\]"

  - it: honours excludeNamespaces
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.excludeNamespaces:
        - kube-system
        - istio-system
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "/var/log/pods/istio-system_"

  - it: drops every file_log receiver entirely when logs are disabled
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.enabled: false
      agent.logs.formats:
        - name: spring
          include: ["/var/log/pods/prod_*/*/*.log"]
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "file_log/"

  - it: exposes OTLP http for app relay
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: otlp-http
            containerPort: 4318
            protocol: TCP

  - it: keeps app OTLP traffic on the local node
    template: service-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - equal:
          path: spec.internalTrafficPolicy
          value: Local

  - it: runs the agent as root so it can read root-owned pod logs
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false

  - it: the catch-all recombines only on ^\s and never guesses severity from text
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats: []
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: recombine"
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: "!\(body matches \\"\^\\\\\\\\s\\"\)"'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: "body matches'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'default: parsed'

  - it: the catch-all still detects JSON and glog structurally
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats: []
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "id: json-severity"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "id: glog-severity"

  - it: a configured format still recombines
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - preset: spring
          include: ["/var/log/pods/prod_*/*/*.log"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: recombine"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "combine_field: body"

  - it: recombines per file AND stream so stderr cannot land inside a stdout record
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - preset: spring
          include: ["/var/log/pods/prod_*/*/*.log"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'source_identifier: attributes\["recombine_source"\]'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'log.file.path"\] \+ "\|" \+ attributes\["log.iostream"\]'

  - it: bounds recombine so an unmatched format cannot buffer forever
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - preset: spring
          include: ["/var/log/pods/prod_*/*/*.log"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "force_flush_period: 5s"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "max_log_size: 1MiB"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "max_log_size: [0-9.]+e\\+"

  - it: routes JSON bodies to the json parser and takes severity from the level field
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: router"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: json_parser"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "parse_from: attributes.level"

  - it: never drops a log whose format neither parser recognises
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "on_error: send_quiet"

  - it: negates a format's continuation pattern so a line it does not know never globs
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: custom
          include: ["/var/log/pods/prod_*/*/*.log"]
          continuationRegex: "^CUSTOM-CONT"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: "!\(body matches \\"\^CUSTOM-CONT\\"\)"'

  - it: double-escapes a format's continuation pattern so expr can compile it
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: custom
          include: ["/var/log/pods/prod_*/*/*.log"]
          continuationRegex: '^\d{2}:\d{2}'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: "!\(body matches \\"\^\\\\\\\\d\{2\}:\\\\\\\\d\{2\}\\"\)"'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry.*[^\\]\\\\d\{2\}'

  - it: maps numeric JSON levels so pino and bunyan get a real severity
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "info: 30"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "error: 50"

  - it: routes glog logs so Doris BE gets a severity
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "id: glog-severity"
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'body matches \\"\^\[IWEF\]\\\\\\\\d\{4\} \\"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'error: \["e"\]'

  - it: can turn the glog route off without touching the JSON route
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.structural.glog.enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "glog-severity"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "id: json-severity"

  - it: lets an operator override the JSON severity field
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.structural.json.severityField: severity_text
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "parse_from: attributes.severity_text"

  - it: extracts trace context from a JSON log so logs correlate to traces
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "\n        trace:\n          trace_id:\n            parse_from: attributes\\.trace_id\n          span_id:\n            parse_from: attributes\\.span_id\n          trace_flags:\n            parse_from: attributes\\.trace_flags\n"

  - it: lets an operator override the JSON trace fields
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.structural.json.traceIdField: traceId
      agent.logs.structural.json.spanIdField: spanId
      agent.logs.structural.json.traceFlagsField: traceFlags
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "\n        trace:\n          trace_id:\n            parse_from: attributes\\.traceId\n          span_id:\n            parse_from: attributes\\.spanId\n          trace_flags:\n            parse_from: attributes\\.traceFlags\n"

  - it: can be turned off entirely, leaving only the container parser
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.structural.json.enabled: false
      agent.logs.structural.glog.enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "type: router"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "type: json_parser"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "type: container"

  - it: does not emit any log receiver when logs are disabled
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "type: container"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "file_log/default:"

  - it: survives a double-quote in a format's continuation pattern
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: custom
          include: ["/var/log/pods/prod_*/*/*.log"]
          continuationRegex: '^"quoted'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: "!\(body matches \\"\^\\\\\\"quoted\\"\)"'

  - it: survives an apostrophe in a format's severity pattern
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: custom
          include: ["/var/log/pods/prod_*/*/*.log"]
          severityRegex: "it's"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'regex: "it''s"'

  - it: quotes json severity mapping values like the glog path does
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.structural.json.severityMapping.info: "custom:log"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '"custom:log"'

  - it: rejects a stale agent.logs.parsing block rather than ignoring it
    template: secret.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.parsing.text.severityRegex: "(?P<severity>[A-Z]+)"
    asserts:
      - failedTemplate:
          errorMessage: 'agent.logs.parsing was removed in chart 0.2.0. Helm ignores unknown keys silently, so leaving it there would drop your overrides without a word and cost you the severities you believe you are setting. Migrate it: agent.logs.parsing.json -> agent.logs.structural.json, and agent.logs.parsing.glog -> agent.logs.structural.glog (behaviour unchanged, both on by default). agent.logs.parsing.text and agent.logs.parsing.continuationRegex are gone entirely — they applied one universal parser to every pod, which mislabelled severity (an ERROR from a service named `trace-service` arrived as Trace(1)). Add an agent.logs.formats entry with the matching preset for each text-logging workload instead. See the 0.1.x -> 0.2.0 migration note in the README.'

  - it: rejects an emptied parsing block even with logs disabled
    template: secret.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.enabled: false
      agent.logs.parsing: {}
    asserts:
      - failedTemplate:
          errorMessage: 'agent.logs.parsing was removed in chart 0.2.0. Helm ignores unknown keys silently, so leaving it there would drop your overrides without a word and cost you the severities you believe you are setting. Migrate it: agent.logs.parsing.json -> agent.logs.structural.json, and agent.logs.parsing.glog -> agent.logs.structural.glog (behaviour unchanged, both on by default). agent.logs.parsing.text and agent.logs.parsing.continuationRegex are gone entirely — they applied one universal parser to every pod, which mislabelled severity (an ERROR from a service named `trace-service` arrived as Trace(1)). Add an agent.logs.formats entry with the matching preset for each text-logging workload instead. See the 0.1.x -> 0.2.0 migration note in the README.'

  - it: renders one receiver per configured format
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: spring
          include: ["/var/log/pods/prod_*/*/*.log"]
          severityRegex: '^\S+ \S+ +(?P<severity>[A-Z]+) '
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "file_log/spring:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "file_log/default:"

  - it: excludes every format glob from the catch-all so no file is read twice
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: spring
          include: ["/var/log/pods/prod_*/*/*.log"]
        - name: clickhouse
          include: ["/var/log/pods/clickhouse_*/*/*.log"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'file_log/default:[\s\S]*exclude:[\s\S]*/var/log/pods/prod_\*/\*/\*.log'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'file_log/default:[\s\S]*exclude:[\s\S]*/var/log/pods/clickhouse_\*/\*/\*.log'

  - it: wires every format receiver into the logs pipeline
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: spring
          include: ["/var/log/pods/prod_*/*/*.log"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "logs:[\\s\\S]*receivers:[\\s\\S]*- file_log/spring"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "logs:[\\s\\S]*receivers:[\\s\\S]*- file_log/default"

  - it: gives earlier formats precedence so overlapping globs never double-read
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: narrow
          include: ["/var/log/pods/prod_api_*/*/*.log"]
        - name: broad
          include: ["/var/log/pods/prod_*/*/*.log"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'file_log/broad:\n\s+include:\n\s+- "[^"]*"\n\s+exclude:\n(\s+#[^\n]*\n)*\s+- "/var/log/pods/prod_api_\*/\*/\*\.log"'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'file_log/narrow:[\s\S]*?exclude:[\s\S]*?file_log/broad:'

  - it: rejects duplicate format names instead of shipping a crash-loop
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: spring
          include: ["/var/log/pods/a_*/*/*.log"]
        - name: spring
          include: ["/var/log/pods/b_*/*/*.log"]
    asserts:
      - failedTemplate:
          errorMessage: 'duplicate agent.logs.formats name "spring". Each name becomes a file_log/<name> receiver key, so duplicates render the same YAML key twice and the collector crash-loops with `mapping key "file_log/spring" already defined`. Give each format a unique name.'

  - it: rejects identical include globs instead of shipping a dead format
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: spring
          include: ["/var/log/pods/a_*/*/*.log"]
        - name: quarkus
          include: ["/var/log/pods/a_*/*/*.log"]
    asserts:
      - failedTemplate:
          errorMessage: 'agent.logs.formats "spring" and "quarkus" have identical include globs ["/var/log/pods/a_*/*/*.log"]. Earlier formats take precedence, so "quarkus" is excluded from every file it asks for and can never collect anything — its operators would never run. Remove "quarkus", or narrow its globs so it claims files "spring" does not.'

  - it: rejects identical include globs regardless of their order
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: spring
          include: ["/var/log/pods/a_*/*/*.log", "/var/log/pods/b_*/*/*.log"]
        - name: quarkus
          include: ["/var/log/pods/b_*/*/*.log", "/var/log/pods/a_*/*/*.log"]
    asserts:
      - failedTemplate:
          errorMessage: 'agent.logs.formats "spring" and "quarkus" have identical include globs ["/var/log/pods/a_*/*/*.log","/var/log/pods/b_*/*/*.log"]. Earlier formats take precedence, so "quarkus" is excluded from every file it asks for and can never collect anything — its operators would never run. Remove "quarkus", or narrow its globs so it claims files "spring" does not.'

  - it: rejects a format with no include globs
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - preset: clickhouse
    asserts:
      - failedTemplate:
          errorMessage: 'agent.logs.formats "clickhouse" has no include globs. Every format needs its own `include`: a preset supplies the parser, never the location. Without it the receiver renders `include: null` and the collector refuses to start with `failed to create "file_log/clickhouse" receiver ... ''include'' must be specified` — the agent DaemonSet crash-loops and the node ships no logs at all, for any workload. Set include to the log paths this format claims, e.g. include: ["/var/log/pods/<namespace>_<pod>-*/*/*.log"].'

  - it: rejects a format with an empty include list
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: myapp
          include: []
    asserts:
      - failedTemplate:
          errorMessage: 'agent.logs.formats "myapp" has no include globs. Every format needs its own `include`: a preset supplies the parser, never the location. Without it the receiver renders `include: null` and the collector refuses to start with `failed to create "file_log/myapp" receiver ... ''include'' must be specified` — the agent DaemonSet crash-loops and the node ships no logs at all, for any workload. Set include to the log paths this format claims, e.g. include: ["/var/log/pods/<namespace>_<pod>-*/*/*.log"].'

  - it: rejects a firstEntryRegex beside a preset's continuationRegex
    template: daemonset-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - preset: spring
          include: ["/var/log/pods/prod_*/*/*.log"]
          firstEntryRegex: '^\d{4}-'
    asserts:
      - failedTemplate:
          errorMessage: 'a log format sets both firstEntryRegex and continuationRegex; they are two directions of the same predicate and recombine takes only one. firstEntryRegex wins outright, so the continuationRegex beside it is dead config that silently does nothing — and a rule you believe is joining your stack traces, but is not, is exactly the failure this chart fails the template to prevent. Set exactly one. If you set firstEntryRegex on a format whose preset ships a continuationRegex, also set continuationRegex to null to drop it — but note firstEntryRegex is the UNSAFE direction: a line it does not match is appended to the record above, so a pattern that misses your format merges the entire stream into one record and stamps it with the first line''s severity. A too-narrow continuationRegex fragments instead, which is recoverable — but a too-BROAD one merges just as badly, so bound whichever you set. See agent.logs.presets in values.yaml.'

  - it: allows a firstEntryRegex when the preset's continuationRegex is dropped
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - preset: spring
          include: ["/var/log/pods/prod_*/*/*.log"]
          continuationRegex: null
          firstEntryRegex: '^\d{4}-'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: "body matches \\"\^\\\\\\\\d\{4\}-\\""'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'file_log/spring:[\s\S]*?is_first_entry: "!\([\s\S]*?file_log/default:'

  - it: allows overlapping but distinct include globs
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - name: narrow
          include: ["/var/log/pods/prod_api_*/*/*.log"]
        - name: broad
          include: ["/var/log/pods/prod_*/*/*.log"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "file_log/narrow:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "file_log/broad:"

  - it: renders only the catch-all when no formats are configured
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats: []
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "file_log/default:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "file_log/spring:"

  - it: expands a preset into a full format receiver
    template: configmap-agent.yaml
    set:
      fixter.apiKey: test-key-123
      agent.logs.formats:
        - preset: clickhouse
          include: ["/var/log/pods/clickhouse_*/*/*.log"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "file_log/clickhouse:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'regex: "<\(\?P<severity>\[A-Za-z\]\+\)>"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'is_first_entry: "!\(body matches \\"\^\\\\\\\\s\|\^\\\\\\\\d\+\\\\\\\\\.\\\\\\\\s\\"\)"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'fatal: \["critical"\]'

  - it: lets a format override a preset field
    template: configmap-agent.yaml
    set:
