suite: cluster collector
templates:
  - configmap-cluster.yaml
  - deployment-cluster.yaml
  - secret.yaml
  - rbac.yaml
tests:
  - it: creates a Secret from apiKey so no pre-step is needed
    template: secret.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.FIXTER_API_KEY
          value: test-key-123

  - it: creates no Secret when bringing your own
    template: secret.yaml
    set:
      fixter.existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: installs with only apiKey set
    template: deployment-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1

  - it: defaults the endpoint to Fixter ingest
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: https://ingest.fixter.dev"

  - it: uses the canonical otlp_http exporter key, not the deprecated alias
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "otlp_http:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "otlphttp:"

  - it: sets memory limits so memory_limiter is not a no-op
    template: deployment-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: passes --config explicitly because the image bakes none
    template: deployment-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --config=/conf/config.yaml

  - it: tolerates all taints by default so the singleton always schedules
    template: deployment-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            operator: Exists

  - it: hardens the container security context
    template: deployment-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: annotates a secret checksum so key rotation restarts pods
    template: deployment-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/secret"]

  - it: converts the memory limit to Go's GOMEMLIMIT format, not Kubernetes'
    template: deployment-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: "512MiB"

  - it: refuses a decimal memory limit rather than shipping a crash-loop
    template: deployment-cluster.yaml
    set:
      fixter.apiKey: test-key-123
      cluster.resources.limits.memory: 512M
    asserts:
      - failedTemplate:
          errorPattern: "must use a binary suffix"

  - it: omits k8s.cluster.name when clusterName is unset (not auto-detected)
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "k8s.cluster.name"

  - it: sets k8s.cluster.name when explicitly overridden
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
      fixter.clusterName: my-cluster
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "value: \"my-cluster\""

  - it: refuses to render with no credentials at all
    template: secret.yaml
    asserts:
      - failedTemplate:
          errorPattern: "no Fixter credentials"

  - it: refuses both apiKey and existingSecret
    template: secret.yaml
    set:
      fixter.apiKey: test-key-123
      fixter.existingSecret: my-secret
    asserts:
      - failedTemplate:
          errorPattern: "not both"

  - it: grants HPA read so k8s_cluster neither drops HPA metrics nor errors
    template: rbac.yaml
    documentIndex: 0
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["autoscaling"]
            resources: ["horizontalpodautoscalers"]
            verbs: ["get", "list", "watch"]

  - it: watches core Kubernetes Events by default
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "k8s_objects:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "name: events"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "mode: watch"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exclude_watch_type:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "- DELETED"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "k8s_objects:\\n    auth_type: serviceAccount\\n    objects:\\n      - name: events\\n        mode: watch\\n        exclude_watch_type:\\n          - DELETED\\nprocessors:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "(?s)k8s_objects:.*?interval:.*?processors:\\n  memory_limiter:"

  - it: routes Events through a logs pipeline to the same exporter
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "logs:\\n      receivers:\\n        - k8s_objects"

  - it: attaches involved-object identity and event reason to Event logs
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "transform/k8s_event_identity:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "processors: \\[memory_limiter, resource_detection, resource, transform/k8s_event_identity, batch\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.namespace.name"\], body\["object"\]\["involvedObject"\]\["namespace"\]\) where body\["object"\]\["involvedObject"\]\["namespace"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.object.kind"\], body\["object"\]\["involvedObject"\]\["kind"\]\) where body\["object"\]\["involvedObject"\]\["kind"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.object.name"\], body\["object"\]\["involvedObject"\]\["name"\]\) where body\["object"\]\["involvedObject"\]\["name"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.event.reason"\], body\["object"\]\["reason"\]\) where body\["object"\]\["reason"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.event.type"\], body\["object"\]\["type"\]\) where body\["object"\]\["type"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(severity_text, "WARN"\) where body\["object"\]\["type"\] == "Warning"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(severity_text, "INFO"\) where body\["object"\]\["type"\] == "Normal"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(time, Time\(body\["object"\]\["lastTimestamp"\], "%Y-%m-%dT%H:%M:%SZ"\)\) where body\["object"\]\["lastTimestamp"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(time, Time\(body\["object"\]\["eventTime"\], "%Y-%m-%dT%H:%M:%SZ"\)\) where body\["object"\]\["lastTimestamp"\] == nil and body\["object"\]\["eventTime"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(time, Time\(body\["object"\]\["firstTimestamp"\], "%Y-%m-%dT%H:%M:%SZ"\)\) where body\["object"\]\["lastTimestamp"\] == nil and body\["object"\]\["eventTime"\] == nil and body\["object"\]\["firstTimestamp"\] != nil'

  - it: omits the Events receiver, the logs pipeline, and the event transform when disabled
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
      cluster.events: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "k8s_objects"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "logs:\\n      receivers"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "transform/k8s_event_identity"

  - it: copies pod and workload identity onto metric datapoints
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "transform/k8s_identity:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "context: datapoint"
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.pod.name"\], resource.attributes\["k8s.pod.name"\]\) where resource.attributes\["k8s.pod.name"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.namespace.name"\], resource.attributes\["k8s.namespace.name"\]\) where resource.attributes\["k8s.namespace.name"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.container.name"\], resource.attributes\["k8s.container.name"\]\) where resource.attributes\["k8s.container.name"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.node.name"\], resource.attributes\["k8s.node.name"\]\) where resource.attributes\["k8s.node.name"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.deployment.name"\], resource.attributes\["k8s.deployment.name"\]\) where resource.attributes\["k8s.deployment.name"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.statefulset.name"\], resource.attributes\["k8s.statefulset.name"\]\) where resource.attributes\["k8s.statefulset.name"\] != nil'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'set\(attributes\["k8s.daemonset.name"\], resource.attributes\["k8s.daemonset.name"\]\) where resource.attributes\["k8s.daemonset.name"\] != nil'

  - it: transforms after resource enrichment and before batching
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "processors: \\[memory_limiter, resource_detection, resource, transform/k8s_identity, batch\\]"

  - it: renders raw scrapeConfigs verbatim so an existing prometheus.yml can be pasted in
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
      integrations.prometheus.scrapeConfigs:
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "job_name: kubernetes-pods"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "kubernetes_sd_configs:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "__meta_kubernetes_pod_annotation_prometheus_io_scrape"

  - it: enables the prometheus receiver from scrapeConfigs alone
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
      integrations.prometheus.scrapeConfigs:
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "\n  prometheus:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "- prometheus"

  - it: keeps static targets working alongside raw scrapeConfigs
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
      integrations.prometheus.targets:
        - job: clickhouse
          endpoints: ["clickhouse.default.svc.cluster.local:9363"]
      integrations.prometheus.scrapeConfigs:
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'job_name: "clickhouse"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: "job_name: kubernetes-pods"

  - it: omits the prometheus receiver when neither form is set
    template: configmap-cluster.yaml
    set:
      fixter.apiKey: test-key-123
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "\n  prometheus:"

  - it: grants the endpoint discovery roles service discovery needs
    template: rbac.yaml
    documentIndex: 0
    set:
      fixter.apiKey: test-key-123
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["discovery.k8s.io"]
            resources: ["endpointslices"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["ingresses"]
            verbs: ["get", "list", "watch"]

  - it: refuses a job name defined in both targets and scrapeConfigs
    template: secret.yaml
    set:
      fixter.apiKey: test-key-123
      integrations.prometheus.targets:
        - job: clickhouse
          endpoints: ["clickhouse.default.svc.cluster.local:9363"]
      integrations.prometheus.scrapeConfigs:
        - job_name: clickhouse
          kubernetes_sd_configs:
            - role: pod
    asserts:
      - failedTemplate:
          errorPattern: "duplicate prometheus job name"
