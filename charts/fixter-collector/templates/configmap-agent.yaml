{{- include "fixter-collector.validate" . }}
{{- if .Values.agent.enabled }}
{{- $root := . }}
{{- $formats := .Values.agent.logs.formats | default list }}
{{- $userNames := dict }}
{{- range $formats }}{{- $n := .name | default .preset }}{{- if $n }}{{- $_ := set $userNames $n true }}{{- end }}{{- end }}
{{- range $name, $bf := .Values.agent.logs.builtinFormats }}
{{- if and $bf.enabled (not (hasKey $userNames $name)) }}
{{- $entry := omit $bf "enabled" }}
{{- $_ := set $entry "name" $name }}
{{- $formats = append $formats $entry }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fixter-collector.fullname" . }}-agent
  labels:
    {{- include "fixter-collector.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      bearertokenauth:
        scheme: Bearer
        token: ${env:FIXTER_API_KEY}
    receivers:
      {{- if .Values.agent.otlpRelay }}
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- end }}
      kubelet_stats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        insecure_skip_verify: true
      {{- if .Values.agent.hostMetrics }}
      host_metrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu:
          memory:
          filesystem:
          network:
          load:
      {{- end }}
      {{- if .Values.agent.logs.enabled }}
      {{- include "fixter-collector.validateLogFormats" $formats }}
      {{- range $i, $fmt := $formats }}
      {{- $spec := $fmt }}
      {{- if $fmt.preset }}
      {{- $base := index $root.Values.agent.logs.presets $fmt.preset }}
      {{- if not $base }}
      {{- fail (printf "unknown log format preset %q. Available presets: %s." $fmt.preset (keys $root.Values.agent.logs.presets | sortAlpha | join ", ")) }}
      {{- end }}
      {{- $spec = deepCopy $base }}
      {{- range $k, $v := (omit $fmt "preset") }}
      {{- $_ := set $spec $k $v }}
      {{- end }}
      {{- end }}
      file_log/{{ $fmt.name | default $fmt.preset }}:
        include:
          {{- range $fmt.include }}
          - {{ . | quote }}
          {{- end }}
        {{- if gt (int $i) 0 }}
        exclude:
          {{- range $j, $prev := $formats }}
          {{- if lt $j $i }}
          {{- range $prev.include }}
          - {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- end }}
        {{- end }}
        start_at: end
        include_file_path: true
        operators:
          {{- include "fixter-collector.logOperators" (dict "spec" $spec "root" $root) | nindent 10 }}
          {{- include "fixter-collector.structuralSeverity" (dict "root" $root) | nindent 10 }}
      {{- end }}
      file_log/default:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*_{{ include "fixter-collector.fullname" . }}*_*/*/*.log
          {{- range .Values.agent.logs.excludeNamespaces }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
          {{- range .Values.agent.logs.excludePods }}
          - /var/log/pods/*_{{ . }}*_*/*/*.log
          {{- end }}
          {{- range $fmt := $formats }}
          {{- range $fmt.include }}
          - {{ . | quote }}
          {{- end }}
          {{- end }}
        start_at: end
        include_file_path: true
        operators:
          {{- include "fixter-collector.logOperators" (dict "spec" (dict "continuationRegex" "^\\s") "root" $root) | nindent 10 }}
          {{- include "fixter-collector.structuralSeverity" (dict "root" $root) | nindent 10 }}
      {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      resource_detection:
        detectors: [env, system]
        timeout: 5s
        override: false
      resource:
        attributes:
          {{- include "fixter-collector.resourceAttributes" . | nindent 10 }}
      resource/derive_service:
        attributes:
          - key: service.name
            from_attribute: k8s.deployment.name
            action: insert
          - key: service.name
            from_attribute: k8s.container.name
            action: insert
          - key: service.namespace
            from_attribute: k8s.namespace.name
            action: insert
          - key: service.instance.id
            from_attribute: k8s.pod.name
            action: insert
      batch:
        timeout: 10s
    exporters:
      otlp_http:
        endpoint: {{ .Values.fixter.endpoint }}
        auth:
          authenticator: bearertokenauth
    service:
      extensions: [health_check, bearertokenauth]
      pipelines:
        metrics:
          receivers:
            - kubelet_stats
            {{- if .Values.agent.hostMetrics }}
            - host_metrics
            {{- end }}
            {{- if .Values.agent.otlpRelay }}
            - otlp
            {{- end }}
          processors: [memory_limiter, k8s_attributes, resource_detection, resource, resource/derive_service, batch]
          exporters: [otlp_http]
        {{- if or .Values.agent.logs.enabled .Values.agent.otlpRelay }}
        logs:
          receivers:
            {{- if .Values.agent.logs.enabled }}
            {{- range $formats }}
            - file_log/{{ .name | default .preset }}
            {{- end }}
            - file_log/default
            {{- end }}
            {{- if .Values.agent.otlpRelay }}
            - otlp
            {{- end }}
          processors: [memory_limiter, k8s_attributes, resource_detection, resource, resource/derive_service, batch]
          exporters: [otlp_http]
        {{- end }}
        {{- if .Values.agent.otlpRelay }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource_detection, resource, batch]
          exporters: [otlp_http]
        {{- end }}
{{- end }}
