{{- include "fixter-collector.validate" . }}
{{- if .Values.agent.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fixter-collector.fullname" . }}-agent
  labels:
    {{- include "fixter-collector.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      bearertokenauth:
        scheme: Bearer
        token: ${env:FIXTER_API_KEY}
    receivers:
      {{- if .Values.agent.otlpRelay }}
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- end }}
      kubelet_stats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        insecure_skip_verify: true
      {{- if .Values.agent.hostMetrics }}
      host_metrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu:
          memory:
          filesystem:
          network:
          load:
      {{- end }}
      {{- if .Values.agent.logs.enabled }}
      file_log:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # Never ship our own logs: that makes the collector log about shipping
          # logs, ship that, and log about it. Not configurable, by design.
          - /var/log/pods/*_{{ include "fixter-collector.fullname" . }}*_*/*/*.log
          {{- range .Values.agent.logs.excludeNamespaces }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
          {{- range .Values.agent.logs.excludePods }}
          - /var/log/pods/*_{{ . }}*_*/*/*.log
          {{- end }}
        start_at: end
        include_file_path: true
        operators:
          - type: container
            id: container-parser
          {{- with .Values.agent.logs.parsing }}
          {{- if .enabled }}
          # Join continuation lines into the record above. source_identifier is
          # not cosmetic: without it every pod on the node shares one stream and
          # unrelated logs get stitched together.
          - type: recombine
            id: multiline
            combine_field: body
            combine_with: "\n"
            # Negated: the pattern describes a CONTINUATION, so a new record is
            # any line that is not one. See continuationRegex in values.yaml for
            # why this direction is the safe one.
            #
            # is_first_entry is an expr expression, so the pattern lands inside a
            # string literal and every backslash must survive TWO unescapes (expr's,
            # then the regex engine's). Without this the collector refuses to start:
            # "failed to compile is_first_entry: invalid char escape".
            is_first_entry: '!(body matches "{{ .continuationRegex | replace "\\" "\\\\" }}")'
            source_identifier: attributes["log.file.path"]
            max_log_size: {{ .maxLogSize }}
            force_flush_period: {{ .forceFlushPeriod }}
          - type: router
            id: format-router
            routes:
              - expr: 'body matches "^\\s*\\{"'
                output: json-severity
            default: text-severity
          # Both parsers are send_quiet on error: an unrecognised format must
          # degrade to "no severity", never to "no log".
          - type: json_parser
            id: json-severity
            parse_from: body
            parse_to: attributes
            on_error: send_quiet
            output: parsed
            severity:
              parse_from: attributes.{{ .json.severityField }}
              {{- with .json.severityMapping }}
              mapping:
                {{- range $level, $value := . }}
                {{ $level }}: {{ $value }}
                {{- end }}
              {{- end }}
          - type: regex_parser
            id: text-severity
            parse_from: body
            regex: '{{ .text.severityRegex }}'
            parse_to: attributes
            on_error: send_quiet
            output: parsed
            severity:
              parse_from: attributes.severity
              {{- with .text.severityMapping }}
              mapping:
                {{- range $level, $values := . }}
                {{ $level }}: [{{ join ", " $values }}]
                {{- end }}
              {{- end }}
          # Both routes converge here; without it json-severity would fall
          # through to text-severity and re-parse its own output.
          - type: noop
            id: parsed
          {{- end }}
          {{- end }}
      {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      resource_detection:
        detectors: [env, system]
        timeout: 5s
        override: false
      resource:
        attributes:
          {{- include "fixter-collector.resourceAttributes" . | nindent 10 }}
      # Pod logs (from file paths) and pod/container metrics (from kubelet) carry no
      # service identity, and Fixter groups every signal by it. Derive the service
      # identity triad from the k8s attributes k8s_attributes already extracted
      # (service.name falls back deployment → container).
      # action: insert only fills a MISSING key, so this is self-scoping:
      #   - OTLP-relayed app telemetry that already set these is never overwritten;
      #   - node/host_metrics have no owning deployment/pod, so the inserts are no-ops
      #     and they stay serviceless, as infra metrics should.
      # (host.* and deployment.environment are already set by resource_detection and the
      #  resource processor; service.version can't be derived from k8s metadata.)
      resource/derive_service:
        attributes:
          - key: service.name
            from_attribute: k8s.deployment.name
            action: insert
          - key: service.name
            from_attribute: k8s.container.name
            action: insert
          - key: service.namespace
            from_attribute: k8s.namespace.name
            action: insert
          - key: service.instance.id
            from_attribute: k8s.pod.name
            action: insert
      batch:
        timeout: 10s
    exporters:
      otlp_http:
        endpoint: {{ .Values.fixter.endpoint }}
        auth:
          authenticator: bearertokenauth
    service:
      extensions: [health_check, bearertokenauth]
      pipelines:
        metrics:
          receivers:
            - kubelet_stats
            {{- if .Values.agent.hostMetrics }}
            - host_metrics
            {{- end }}
            {{- if .Values.agent.otlpRelay }}
            - otlp
            {{- end }}
          processors: [memory_limiter, k8s_attributes, resource_detection, resource, resource/derive_service, batch]
          exporters: [otlp_http]
        {{- if or .Values.agent.logs.enabled .Values.agent.otlpRelay }}
        logs:
          receivers:
            {{- if .Values.agent.logs.enabled }}
            - file_log
            {{- end }}
            {{- if .Values.agent.otlpRelay }}
            - otlp
            {{- end }}
          processors: [memory_limiter, k8s_attributes, resource_detection, resource, resource/derive_service, batch]
          exporters: [otlp_http]
        {{- end }}
        {{- if .Values.agent.otlpRelay }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource_detection, resource, batch]
          exporters: [otlp_http]
        {{- end }}
{{- end }}
