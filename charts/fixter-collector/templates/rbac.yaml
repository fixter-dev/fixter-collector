apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fixter-collector.fullname" . }}
  labels:
    {{- include "fixter-collector.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - nodes
      - nodes/proxy
      - nodes/stats
      - pods
      - replicationcontrollers
      - resourcequotas
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fixter-collector.fullname" . }}
  labels:
    {{- include "fixter-collector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fixter-collector.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fixter-collector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
