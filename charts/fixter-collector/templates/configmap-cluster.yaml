{{- include "fixter-collector.validate" . }}
{{- if .Values.cluster.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fixter-collector.fullname" . }}-cluster
  labels:
    {{- include "fixter-collector.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      bearertokenauth:
        scheme: Bearer
        token: ${env:FIXTER_API_KEY}
    receivers:
      {{- if .Values.cluster.clusterMetrics }}
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
      {{- end }}
      {{- if .Values.cluster.events }}
      k8s_objects:
        auth_type: serviceAccount
        objects:
          - name: events
            mode: watch
            exclude_watch_type:
              - DELETED
      {{- end }}
      {{- if or .Values.integrations.prometheus.targets .Values.integrations.prometheus.scrapeConfigs }}
      prometheus:
        config:
          scrape_configs:
            {{- range .Values.integrations.prometheus.targets }}
            - job_name: {{ .job | quote }}
              scrape_interval: {{ default "30s" .interval }}
              static_configs:
                - targets:
                    {{- range .endpoints }}
                    - {{ . | quote }}
                    {{- end }}
            {{- end }}
            {{- with .Values.integrations.prometheus.scrapeConfigs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource_detection:
        detectors: [env, system]
        timeout: 5s
        override: false
      resource:
        attributes:
          {{- include "fixter-collector.resourceAttributes" . | nindent 10 }}
      transform/k8s_identity:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["k8s.pod.name"], resource.attributes["k8s.pod.name"]) where resource.attributes["k8s.pod.name"] != nil
              - set(attributes["k8s.namespace.name"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
              - set(attributes["k8s.container.name"], resource.attributes["k8s.container.name"]) where resource.attributes["k8s.container.name"] != nil
              - set(attributes["k8s.node.name"], resource.attributes["k8s.node.name"]) where resource.attributes["k8s.node.name"] != nil
              - set(attributes["k8s.deployment.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["k8s.deployment.name"] != nil
              - set(attributes["k8s.statefulset.name"], resource.attributes["k8s.statefulset.name"]) where resource.attributes["k8s.statefulset.name"] != nil
              - set(attributes["k8s.daemonset.name"], resource.attributes["k8s.daemonset.name"]) where resource.attributes["k8s.daemonset.name"] != nil
      {{- if .Values.cluster.events }}
      transform/k8s_event_identity:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["k8s.namespace.name"], body["object"]["involvedObject"]["namespace"]) where body["object"]["involvedObject"]["namespace"] != nil
              - set(attributes["k8s.object.kind"], body["object"]["involvedObject"]["kind"]) where body["object"]["involvedObject"]["kind"] != nil
              - set(attributes["k8s.object.name"], body["object"]["involvedObject"]["name"]) where body["object"]["involvedObject"]["name"] != nil
              - set(attributes["k8s.event.reason"], body["object"]["reason"]) where body["object"]["reason"] != nil
              - set(attributes["k8s.event.type"], body["object"]["type"]) where body["object"]["type"] != nil
              - set(resource.attributes["k8s.pod.name"], body["object"]["involvedObject"]["name"]) where body["object"]["involvedObject"]["kind"] == "Pod"
              - set(resource.attributes["k8s.namespace.name"], body["object"]["involvedObject"]["namespace"]) where body["object"]["involvedObject"]["kind"] == "Pod"
              - set(severity_text, "WARN") where body["object"]["type"] == "Warning"
              - set(severity_text, "INFO") where body["object"]["type"] == "Normal"
              - set(time, Time(body["object"]["lastTimestamp"], "%Y-%m-%dT%H:%M:%SZ")) where body["object"]["lastTimestamp"] != nil
              - set(time, Time(body["object"]["eventTime"], "%Y-%m-%dT%H:%M:%SZ")) where body["object"]["lastTimestamp"] == nil and body["object"]["eventTime"] != nil
              - set(time, Time(body["object"]["firstTimestamp"], "%Y-%m-%dT%H:%M:%SZ")) where body["object"]["lastTimestamp"] == nil and body["object"]["eventTime"] == nil and body["object"]["firstTimestamp"] != nil
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          otel_annotations: true
          metadata:
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
      transform/k8s_event_service:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["k8s.workload.name"], body["object"]["involvedObject"]["name"]) where IsMatch(body["object"]["involvedObject"]["kind"], "^(Pod|ReplicaSet|Deployment|StatefulSet|DaemonSet|CronJob|Job)$")
              - replace_pattern(attributes["k8s.workload.name"], "-[bcdfghjklmnpqrstvwxz2456789]{5}$", "") where body["object"]["involvedObject"]["kind"] == "Pod"
              - replace_pattern(attributes["k8s.workload.name"], "-[0-9]+$", "") where body["object"]["involvedObject"]["kind"] == "Pod"
              - replace_pattern(attributes["k8s.workload.name"], "-[bcdfghjklmnpqrstvwxz2456789]{6,10}$", "") where IsMatch(body["object"]["involvedObject"]["kind"], "^(Pod|ReplicaSet)$")
              - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.statefulset.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.statefulset.name"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.daemonset.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.daemonset.name"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.cronjob.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.cronjob.name"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.job.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.job.name"] != nil
              - set(resource.attributes["service.name"], attributes["k8s.workload.name"]) where resource.attributes["service.name"] == nil and attributes["k8s.workload.name"] != nil
              - set(resource.attributes["service.name"], "kubernetes") where resource.attributes["service.name"] == nil
              - set(resource.attributes["service.namespace"], attributes["k8s.namespace.name"]) where attributes["k8s.namespace.name"] != nil
              - set(attributes["k8s.event.count"], body["object"]["count"]) where body["object"]["count"] != nil
              - set(body, body["object"]["message"]) where body["object"]["message"] != nil
      {{- end }}
      batch:
        timeout: 10s
    exporters:
      otlp_http:
        endpoint: {{ .Values.fixter.endpoint }}
        auth:
          authenticator: bearertokenauth
    service:
      extensions: [health_check, bearertokenauth]
      pipelines:
        metrics:
          receivers:
            {{- if .Values.cluster.clusterMetrics }}
            - k8s_cluster
            {{- end }}
            {{- if or .Values.integrations.prometheus.targets .Values.integrations.prometheus.scrapeConfigs }}
            - prometheus
            {{- end }}
          processors: [memory_limiter, resource_detection, resource, transform/k8s_identity, batch]
          exporters: [otlp_http]
        {{- if .Values.cluster.events }}
        logs:
          receivers:
            - k8s_objects
          processors: [memory_limiter, transform/k8s_event_identity, k8s_attributes, resource_detection, resource, transform/k8s_event_service, batch]
          exporters: [otlp_http]
        {{- end }}
{{- end }}
