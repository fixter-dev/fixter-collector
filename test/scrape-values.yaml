fixter:
  apiKey: dummy

integrations:
  prometheus:
    targets:
      - job: static-endpoint
        endpoints: ["some-service.default.svc.cluster.local:9363"]
        interval: 30s
    scrapeConfigs:
      - job_name: kubernetes-pods
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            action: drop
            regex: go_gc_.*
