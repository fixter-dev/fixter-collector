apiVersion: v1
kind: ConfigMap
metadata:
  name: otlp-sink
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
    service:
      telemetry:
        logs:
          output_paths: ["/data/sink.log"]
        # Exposed so the collector under test has a real Prometheus endpoint to
        # scrape. These otelcol_* series exist nowhere else in this cluster, so
        # their arrival at the sink proves the scrape path end to end.
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [debug]
        logs:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otlp-sink
spec:
  replicas: 1
  selector:
    matchLabels: {app: otlp-sink}
  template:
    metadata:
      labels: {app: otlp-sink}
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: sink
          image: otel/opentelemetry-collector-contrib:0.156.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - containerPort: 4318
            - containerPort: 8888
          volumeMounts:
            - {name: config, mountPath: /conf}
            - {name: data, mountPath: /data}
        - name: reader
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: otlp-sink}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otlp-sink
spec:
  selector: {app: otlp-sink}
  ports:
    - port: 4318
      targetPort: 4318
