name: ci
on:
  pull_request:
  push:
    branches: [main]

# Actions pinned to full patch version tags (@v7.0.0, not @v7) — a specific
# immutable release, readable. Runners are GitHub-hosted arm64 (ubuntu-24.04-arm).
env:
  GO_VERSION: '1.26.5'
  HELM_VERSION: 'v4.2.3'          # primary target
  KIND_VERSION: 'v0.32.0'
  KIND_NODE_IMAGE: 'kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5'
  UNITTEST_VERSION: 'v1.1.1'
  ARCHES: 'amd64 arm64'   # keep in sync with release.yml

jobs:
  # Two cells: Helm 4 is what customers get from `latest`; Helm 3.21 is the
  # compat guard until its 2027-02-10 security EOL. Same chart, no conditionals
  # — the matrix only catches accidental dependence on Helm-4-only behaviour.
  chart:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        helm: ['v4.2.3', 'v3.21.3']
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ matrix.helm }}   # REQUIRED: default 'latest' is a moving target
      - name: Confirm the Helm under test is the one we asked for
        run: helm version --short | grep -q "^${{ matrix.helm }}" || { echo "wanted ${{ matrix.helm }}, got $(helm version --short)"; exit 1; }
      - name: Install helm-unittest (pinned)
        # Helm 4 requires --verify=false for git sources; Helm 3 has no such flag.
        run: |
          if helm version --short | grep -q '^v4\.'; then
            helm plugin install https://github.com/helm-unittest/helm-unittest.git --version ${{ env.UNITTEST_VERSION }} --verify=false
          else
            helm plugin install https://github.com/helm-unittest/helm-unittest.git --version ${{ env.UNITTEST_VERSION }}
          fi
      - run: helm lint charts/fixter-collector
      - run: helm unittest charts/fixter-collector

  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40   # compiles from source once per arch in ARCHES (~7.5 min each); bounded, not GitHub's 360 default
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Assert every released arch compiles AND executes
        # A customer hit `exec /fixter-collector: exec format error` because the
        # image was arm64-only. Compiling for an arch proves nothing about the
        # image; this actually RUNS each arch's binary out of its own image layer.
        # The run check alone is not enough: on an arm64 CI runner, an arm64
        # binary mislabeled as amd64 will still exec successfully (the kernel
        # dispatches on the binary's own ELF machine type, not the image's
        # declared platform), so a mismatched binary can silently pass the run
        # check. The ELF check below inspects the actual bytes copied into each
        # image and is what actually proves the arch is right — do not drop
        # either check, they catch different failure modes.
        run: |
          for arch in ${ARCHES}; do
            TARGET_ARCH="$arch" ./scripts/build.sh
            docker buildx build --platform "linux/$arch" --load \
              -t "fixter-collector:$arch-check" .
            docker run --rm --platform "linux/$arch" "fixter-collector:$arch-check" \
              --version | grep -qx 'fixter-collector version 0.1.0'
            case "$arch" in
              amd64) want='x86-64' ;;
              arm64) want='aarch64' ;;
              *) echo "no ELF machine mapping for $arch"; exit 1 ;;
            esac
            cid=$(docker create --platform "linux/$arch" "fixter-collector:$arch-check")
            docker cp "$cid:/fixter-collector" "/tmp/check-$arch"
            docker rm "$cid"
            file "/tmp/check-$arch" | grep -q "$want" || {
              echo "$arch image contains the wrong binary:"; file "/tmp/check-$arch"; exit 1; }
            echo "$arch OK"
          done
      - name: Assert the component set and versions
        run: |
          ./_build/fixter-collector --version | grep -qx 'fixter-collector version 0.1.0'
          # Any module NOT on a pinned stream is a component that resolved to an
          # unintended version — the exact failure strict versioning misses.
          if ./_build/fixter-collector components | grep "module:" | grep -v "v0.156.0" | grep -v "v1.62.0"; then
            echo "unpinned component version above"; exit 1
          fi
      - name: Validate every rendered config against the real binary
        run: ./scripts/validate.sh
      # Three passes: the catch-all's goldens, every preset's goldens, and the
      # no-merge guard — N ordinary lines with no stack trace among them must
      # produce N records, because any join with no trace present is a preset
      # swallowing a log line. See test/formats/README.md.
      #
      # Builds the chart's filelog receiver in-process from the CHART's rendered
      # config, so it needs helm but NOT ./_build/fixter-collector. It sits in
      # this job because the job already has Go and Helm, not because it depends
      # on the build above.
      - name: Verify log formats, that no preset merges ordinary lines, and that no file is collected twice
        run: go test ./... -count=1
        working-directory: test/formats

  smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25   # builds the image (compile) + kind cluster + install + assert
    needs: [chart, build]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: fixter-smoke
          version: ${{ env.KIND_VERSION }}        # default is v0.31.0, not what we want
          node_image: ${{ env.KIND_NODE_IMAGE }}  # default follows kind's version, not ours
      # kind-action (above) creates the pinned cluster; smoke.sh builds+loads the
      # image, installs the chart, and asserts telemetry reaches the sink. Helm 4
      # defaults new installs to server-side apply, so this exercises SSA for real.
      - name: Smoke test — assert telemetry reaches an OTLP sink
        run: ./scripts/smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: kubectl logs -l app.kubernetes.io/name=fixter-collector --all-containers --tail=100
