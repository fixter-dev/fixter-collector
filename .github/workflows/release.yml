name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

# Actions pinned to full patch version tags (@v7.0.0, not @v7).
env:
  GO_VERSION: '1.26.5'
  HELM_VERSION: 'v3.21.3'

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}   # REQUIRED: default 'latest' is now Helm 4

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        env:
          TAG: ${{ steps.v.outputs.version }}
        run: |
          ./scripts/build.sh
          docker build -t "ghcr.io/fixter-dev/fixter-collector:${TAG}" .
          docker push "ghcr.io/fixter-dev/fixter-collector:${TAG}"

      - name: Package and push the chart
        run: |
          helm package charts/fixter-collector \
            --version ${{ steps.v.outputs.version }} \
            --app-version ${{ steps.v.outputs.version }}
          helm push fixter-collector-${{ steps.v.outputs.version }}.tgz oci://ghcr.io/fixter-dev/charts
